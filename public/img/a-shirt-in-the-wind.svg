<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1600" viewBox="0 0 1400 1600" role="img" aria-labelledby="title desc"><title id="title">A shirt in the wind</title><desc id="desc">An original poem and print. From a kitchen window, a yellow shirt held by two wooden pegs opens its sleeves in the wind. The fourteen-line poem ends with the image of someone glad to see the speaker.</desc><style>text{font-family:Georgia,'Times New Roman',serif;fill:#293f4d}.verse-line{font-size:33px}.small{font-family:'Segoe UI',Arial,sans-serif;font-size:15px;letter-spacing:2px;fill:#6e7774}</style><defs><clipPath id="shirt-frame"><rect x="70" y="70" width="1260" height="820"/></clipPath><clipPath id="shirt-fabric"><path d="M590 245L645 267Q700 302 755 263L810 241C863 259 918 290 977 319L1081 370L1042 464L899 395C916 464 949 535 934 620Q924 692 916 735C817 763 701 789 572 746Q551 674 552 610L562 394L414 477L356 388L511 286Z"/></clipPath><pattern id="shirt-grain" width="43" height="37" patternUnits="userSpaceOnUse"><path d="M4 8h2M29 23h1.4M18 34h1M40 4h1" stroke="#fff9df" stroke-width=".7" opacity=".3"/><circle cx="13" cy="21" r=".5" fill="#263d4a" opacity=".16"/></pattern></defs><rect width="1400" height="1600" fill="#f6efdd"/><g id="shirt-picture" clip-path="url(#shirt-frame)"><rect x="70" y="70" width="1260" height="820" fill="#9eb7c5"/><path d="M70 421L1330 161V890H70Z" fill="#d6d9ca"/><path d="M70 610L1330 358V890H70Z" fill="#bbc9c2"/><path d="M1098 210H1288V676H1098Z" fill="#7693a1"/><path d="M1122 236H1264V647H1122Z" fill="#456576"/><path d="M1193 236V647M1122 427H1264" stroke="#bbcac7" stroke-width="7"/><path d="M70 795C232 722 268 836 449 775S756 852 936 789S1190 747 1330 766V890H70Z" fill="#6b8984"/><path d="M98 830C286 760 317 867 488 814S741 888 904 821S1216 797 1314 810" fill="none" stroke="#91a79c" stroke-width="12"/><path d="M150 190Q700 290 1250 170" fill="none" stroke="#475968" stroke-width="3"/><path d="M150 194Q700 294 1250 174" fill="none" stroke="#eff0de" stroke-width="1" opacity=".65"/><path d="M599 262L824 260C948 333 1008 360 1088 394L1054 486L920 420Q971 640 926 756C789 807 668 802 574 768L566 419L420 493L365 407Z" fill="#657f83" opacity=".22"/><path d="M590 245L645 267Q700 302 755 263L810 241C863 259 918 290 977 319L1081 370L1042 464L899 395C916 464 949 535 934 620Q924 692 916 735C817 763 701 789 572 746Q551 674 552 610L562 394L414 477L356 388L511 286Z" fill="#e3ad3e"/><g clip-path="url(#shirt-fabric)"><path d="M641 254C668 393 658 521 705 747L790 786C757 612 831 453 799 250Z" fill="#f3cb61"/><path d="M806 245C842 345 895 482 871 619Q852 708 866 772L960 740Q964 482 886 365L1081 422L1100 368Z" fill="#cd8b2e"/><path d="M363 386Q467 350 564 313L563 354Q469 401 400 437Z" fill="#f3c65c"/><path d="M602 291Q589 459 611 617T634 771" fill="none" stroke="#ad742b" stroke-width="3" opacity=".5"/><path d="M764 294C782 394 751 470 768 554S780 701 799 770M820 334Q858 459 848 548M590 687Q721 739 925 695" fill="none" stroke="#b57c2b" stroke-width="3" opacity=".45"/><path d="M637 287C651 406 645 533 673 657M705 308Q726 426 711 554M779 580Q785 655 810 708" fill="none" stroke="#fff0b1" stroke-width="4" opacity=".65"/><path d="M381 407L414 460M1057 381L1031 447" stroke="#a9742b" stroke-width="5" opacity=".5"/><rect x="340" y="230" width="770" height="570" fill="url(#shirt-grain)"/></g><path d="M645 267Q700 302 755 263" fill="none" stroke="#aa762c" stroke-width="10"/><path d="M650 265Q700 291 750 262" fill="none" stroke="#f9d987" stroke-width="4"/><path d="M574 735Q724 775 914 723" fill="none" stroke="#f8d985" stroke-width="7"/><g transform="rotate(7 590 235)"><rect x="579" y="204" width="22" height="65" rx="6" fill="#c69663"/><path d="M590 212V255" stroke="#795b48" stroke-width="2"/><circle cx="590" cy="234" r="4" fill="#8d6b4c"/><path d="M583 210V262" stroke="#ead2a7" stroke-width="3"/></g><g transform="rotate(-6 810 231)"><rect x="799" y="200" width="22" height="65" rx="6" fill="#c69663"/><path d="M810 208V251" stroke="#795b48" stroke-width="2"/><circle cx="810" cy="230" r="4" fill="#8d6b4c"/><path d="M803 206V258" stroke="#ead2a7" stroke-width="3"/></g><path d="M88 70H258C242 197 182 301 220 449S177 686 213 844H92Z" fill="#f2ecd8"/><path d="M154 74C198 217 115 331 164 469S129 712 166 838M210 74C197 223 151 310 184 435S157 695 193 842" fill="none" stroke="#d0d0c4" stroke-width="6"/><path d="M70 70H1330V890H70Z" fill="none" stroke="#344d5d" stroke-width="28"/><path d="M70 846H1330V890H70Z" fill="#bd7a60"/><path d="M70 846H1330" stroke="#e2b893" stroke-width="6"/></g><text x="110" y="950" class="small">AN ORIGINAL POEM &amp; PRINT</text><text x="110" y="1017" font-size="62">A shirt in the wind</text><g class="verse-stanza" data-stanza="1"><text x="110" y="1090" class="verse-line">The rain stops.</text><text x="110" y="1134" class="verse-line">On the washing line</text><text x="110" y="1178" class="verse-line">a yellow shirt</text><text x="110" y="1222" class="verse-line">fills with the wind.</text></g><g class="verse-stanza" data-stanza="2"><text x="110" y="1305" class="verse-line">Two wooden pegs</text><text x="110" y="1349" class="verse-line">hold its shoulders.</text><text x="110" y="1393" class="verse-line">Its sleeves lift,</text><text x="110" y="1437" class="verse-line">then settle.</text></g><g class="verse-stanza" data-stanza="3"><text x="755" y="1090" class="verse-line">Another gust,</text><text x="755" y="1134" class="verse-line">and both arms open.</text></g><g class="verse-stanza" data-stanza="4"><text x="755" y="1217" class="verse-line">From the kitchen window</text><text x="755" y="1261" class="verse-line">it looks, for a moment,</text><text x="755" y="1305" class="verse-line">like someone</text><text x="755" y="1349" class="verse-line">glad to see me.</text></g><text x="110" y="1538" class="small">A SMALL OBSERVATORY</text></svg>
